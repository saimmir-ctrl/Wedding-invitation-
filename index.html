<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Saim & Hanna</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#eee7da}body{font-family:Georgia,serif;color:#574b3b;overflow-x:hidden;overflow-y:auto}
.page{min-height:100svh;display:grid;place-items:center;padding:20px 16px}
.scene{width:min(94vw,430px);min-height:760px;position:relative;display:flex;align-items:center;justify-content:center;perspective:1200px;-webkit-perspective:1200px}
.envelope{position:relative;width:360px;height:235px;padding:0;border:0;background:transparent;cursor:pointer;filter:drop-shadow(0 15px 18px #0002);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.back{position:absolute;inset:0;background:#7c8770;border-radius:4px}
.card{position:absolute;left:50%;bottom:15px;width:320px;height:205px;transform:translateX(-50%);-webkit-transform:translateX(-50%);z-index:2;overflow:hidden;background:#fbf7ed;border:1px solid #c4a76b;padding:35px 22px 25px;text-align:center;color:#574b3b;transition:transform 1.2s cubic-bezier(.2,.8,.2,1),height 1s .6s,width 1s .6s,bottom 1s .6s,padding 1s .6s;-webkit-transition:-webkit-transform 1.2s cubic-bezier(.2,.8,.2,1),height 1s .6s,width 1s .6s,bottom 1s .6s,padding 1s .6s}
.card:before{content:"";position:absolute;inset:8px;border:1px solid #dbc99c;pointer-events:none}
.bismillah{font-size:38px;line-height:1;color:#a27c38;margin:2px 0 9px}
.hosts{font-size:14px;line-height:1.4;margin:0}
.couple-names{margin-top:16px;margin-bottom:12px;text-align:center;color:#9a7435}
.groom,.bride{font-family:Georgia,"Times New Roman",serif;font-size:32px;font-style:italic;line-height:1.08}
.with{margin:3px 0;font-size:10px;letter-spacing:3px;text-transform:uppercase}
.details{opacity:0;max-height:0;overflow:hidden;font-size:12.5px;line-height:1.5;transition:opacity .65s 1.35s,max-height .65s 1.35s}
.program{margin:10px 0 7px;font-size:13px;letter-spacing:3px;color:#9a7435;font-weight:bold}
.event{margin:8px 0}.venue{margin-top:10px;font-size:11.5px;line-height:1.45}.closing{margin-top:14px;font-size:11.5px;font-style:italic;color:#9a7435;line-height:1.4}
.front{position:absolute;inset:0;z-index:4;overflow:hidden}
.front:before,.front:after{content:"";position:absolute;bottom:0;width:0;height:0;border-style:solid}
.front:before{left:0;border-width:117px 180px;border-color:transparent transparent #707b65 #707b65}
.front:after{right:0;border-width:117px 180px;border-color:transparent #707b65 #707b65 transparent}
.flap{position:absolute;left:0;top:0;width:0;height:0;z-index:5;border-left:180px solid transparent;border-right:180px solid transparent;border-top:128px solid #87927b;transform-origin:top;-webkit-transform-origin:top;transition:transform .8s;-webkit-transition:-webkit-transform .8s;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.seal{position:absolute;z-index:6;left:50%;top:86px;width:46px;height:46px;transform:translateX(-50%);-webkit-transform:translateX(-50%);border-radius:50%;background:#a7894f;color:#f7edd5;display:grid;place-items:center;font-size:22px;transition:.4s}
.open .flap{transform:rotateX(180deg);-webkit-transform:rotateX(180deg);z-index:1}
.open .seal{opacity:0;transform:translateX(-50%) scale(.6);-webkit-transform:translateX(-50%) scale(.6)}
.open .card{position:fixed;left:50%;top:50%;bottom:auto;transform:translate(-50%,-50%);-webkit-transform:translate(-50%,-50%);height:min(680px,92svh);width:min(350px,90vw);padding:30px 24px 28px;z-index:20}
.open .details{opacity:1;max-height:430px}
.hint{position:absolute;bottom:45px;letter-spacing:2px;text-transform:uppercase;font-size:12px;transition:opacity .45s}.is-open .hint{opacity:0}
@media(max-width:390px){.scene{transform:scale(.92)}}@media(max-height:760px){.scene{transform:scale(.88)}}

/* --- Premium refinements --- */
:root{
  --ivory:#fbf6ea;
  --ivory-deep:#f6eedf;
  --sage:#748068;
  --sage-deep:#66725d;
  --sage-light:#8a967f;
  --gold:#b19052;
  --gold-soft:#d8c79b;
  --ink:#514638;
}

body{
  background:
    radial-gradient(circle at 20% 15%, rgba(255,255,255,.55), transparent 28%),
    radial-gradient(circle at 80% 85%, rgba(255,255,255,.35), transparent 26%),
    #eee7da;
}

.envelope{
  filter: drop-shadow(0 20px 28px rgba(58,49,38,.18));
}

.envelope::after{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.16;
  mix-blend-mode:multiply;
  background-image:
    radial-gradient(circle at 20% 25%, rgba(255,255,255,.75) 0 1px, transparent 1.2px),
    radial-gradient(circle at 70% 65%, rgba(71,81,64,.35) 0 1px, transparent 1.2px);
  background-size:18px 18px, 22px 22px;
}

.flap{
  background:linear-gradient(180deg, #8d9882 0%, #7d8972 100%);
  box-shadow:0 4px 10px rgba(50,55,45,.08);
}

.front:before,
.front:after{
  background:linear-gradient(180deg, #748068 0%, #69745f 100%);
}

.seal{
  box-shadow:0 4px 10px rgba(80,59,26,.22), inset 0 0 0 1px rgba(255,255,255,.2);
}

.card{
  background:
    linear-gradient(rgba(255,255,255,.18), rgba(255,255,255,.18)),
    var(--ivory);
  border:1px solid var(--gold);
  box-shadow:0 16px 34px rgba(70,55,35,.16);
  color:var(--ink);
}

.card:before{
  inset:7px;
  border:1px solid var(--gold-soft);
}

.bismillah{
  color:#9b793d;
}

.hosts strong{
  letter-spacing:.15px;
}

.groom,.bride{
  font-family: Georgia, "Times New Roman", serif;
  font-size:34px;
  font-style:italic;
  font-weight:400;
  letter-spacing:.2px;
  text-shadow:0 .3px 0 rgba(255,255,255,.45);
}

.with{
  letter-spacing:4px;
  opacity:.75;
}

.program{
  position:relative;
  display:inline-block;
  padding:0 10px;
}

.program:before,
.program:after{
  content:"";
  position:absolute;
  top:50%;
  width:34px;
  height:1px;
  background:linear-gradient(90deg, transparent, var(--gold-soft));
}

.program:before{
  right:100%;
}

.program:after{
  left:100%;
  transform:scaleX(-1);
}

.event{
  position:relative;
  margin:9px 0;
}

.event + .event:before{
  content:"•";
  display:block;
  color:var(--gold);
  font-size:10px;
  line-height:1;
  margin:1px 0 7px;
}

.venue{
  position:relative;
  margin-top:13px;
  padding-top:11px;
}

.venue:before{
  content:"";
  position:absolute;
  top:0;
  left:50%;
  width:78px;
  height:1px;
  transform:translateX(-50%);
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
}

.closing{
  margin-top:15px;
  font-family: Georgia, "Times New Roman", serif;
  font-size:11.7px;
}

/* More luxurious opening sequence */
.flap{
  transition:transform .72s cubic-bezier(.22,.75,.2,1), z-index .01s linear .52s;
  transform-origin:top;
}

.card{
  transition:
    transform 1s cubic-bezier(.2,.8,.2,1) .38s,
    top 1s cubic-bezier(.2,.8,.2,1) .38s,
    left 1s cubic-bezier(.2,.8,.2,1) .38s,
    height .9s ease .38s,
    width .9s ease .38s,
    padding .9s ease .38s,
    box-shadow .9s ease .38s;
}

.open .flap{
  transform:rotateX(180deg);
}

.open .card{
  box-shadow:0 24px 50px rgba(63,47,27,.23);
  animation:cardSettle 1.15s cubic-bezier(.2,.8,.2,1) .34s both;
}

@keyframes cardSettle{
  0%{
    opacity:.98;
    transform:translate(-50%, 12%) scale(.985);
  }
  68%{
    opacity:1;
    transform:translate(-50%, -52%) scale(1.006);
  }
  100%{
    opacity:1;
    transform:translate(-50%, -50%) scale(1);
  }
}

@media (prefers-reduced-motion: reduce){
  .flap,.card{transition:none!important;animation:none!important}
}


/* Cross-browser Arabic Bismillah rendering */
.bismillah{
  font-family:"Geeza Pro","Noto Naskh Arabic","Noto Sans Arabic","Traditional Arabic",serif;
  font-size:25px;
  font-weight:400;
  line-height:1.65;
  letter-spacing:0;
  white-space:nowrap;
  direction:rtl;
  unicode-bidi:isolate;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}


.buffet-time{
  display:inline-block;
  margin-top:4px;
  font-size:11px;
  font-style:italic;
  color:#9a7435;
  letter-spacing:.3px;
}

</style>
</head>
<body>
<main class="page"><section class="scene">
<button class="envelope" id="envelope" type="button" aria-expanded="false">
<span class="back"></span>
<article class="card">
<div class="bismillah" lang="ar" dir="rtl">بِسْمِ ٱللَّٰهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
<p class="hosts"><strong>Muzafar Ahmad Mir &amp; Samina Yesvi</strong><br>cordially invite you to the wedding ceremony of their son</p>
<div class="couple-names"><div class="groom">Saim</div><div class="with">with</div><div class="bride">Hanna</div></div>
<div class="details">
<div class="program">PROGRAM</div>
  <div class="event"><strong>MASNANDNISHINI</strong><br>3 October 2026 • 2:00 PM<br><span class="buffet-time">Buffet • 2:00 PM – 4:30 PM</span></div>
  <div class="venue"><strong>VENUE</strong><br>Mir Manzil<br>171, Sector B, Gulbahar Colony<br>Hyderpora, Srinagar</div><div class="closing">Your presence will make our celebration complete.</div>
</div></article>
<span class="front"></span><span class="flap"></span><span class="seal">❦</span>
</button>
<p class="hint">Tap the envelope to open</p>
</section></main>
<script>
(()=>{const envelope=document.getElementById("envelope");const scene=document.querySelector(".scene");function setOpen(open){envelope.classList.toggle("open",open);scene.classList.toggle("is-open",open);envelope.setAttribute("aria-expanded",String(open));}envelope.addEventListener("click",()=>setOpen(!envelope.classList.contains("open")));document.addEventListener("keydown",event=>{if(event.key==="Escape")setOpen(false);});})();
</script>
</body></html>
